name: Test generation

on:
  schedule:
    # 06:00 UTC, Monday–Friday
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
      DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
      DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}
      DIDAXIS_API_TOKEN: ${{ secrets.DIDAXIS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_PASSWORD: ${{ secrets.ATLASSIAN_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          agent -p --force --trust --output-format text "$(cat <<'EOF'
          Work the Jira backlog of tickets in status "In Progress".

          Budget: 5 tickets this run. For each ticket, in order:
          1. Analyze the ticket into a test plan. Follow .cursor/skills/jira-ticket-to-gherkin/SKILL.md and .cursor/rules/qa-orchestration.mdc. Crawl the app before finalizing the plan.
          2. Write a conforming Playwright spec under tests/. Follow .cursor/rules/playwright-conventions.mdc and the pom-conventions, a11y-checks, and api-cleanup skills. Add page objects or helpers only when the spec needs them (pages/, tests/helpers/, fixtures/). Do not edit application source or playwright.config.ts.
          3. Run that spec with npx playwright test.
          4. Open a pull request linked to the ticket. Put the Jira key in the branch name, commit message, and PR title. Add the tests-generated label.
          5. Never merge. A human approves the pull request.

          If the spec is red, follow the orchestration loop guard (at most 3 delegations; do not re-run the same failing spec more than twice). Leave the pull request unmerged.
          EOF
          )"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
